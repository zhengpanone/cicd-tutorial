# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: devops

---
# PersistentVolume - Jenkins logs
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-logs-pv
  labels:
    app: jenkins
    type: logs
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/jenkins/logs
    type: DirectoryOrCreate

---
# PersistentVolume - Jenkins data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-data-pv
  labels:
    app: jenkins
    type: data
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/jenkins/data
    type: DirectoryOrCreate

---
# PersistentVolume - Maven cache
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-maven-repo-pv
  labels:
    app: jenkins
    type: maven-repo
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/jenkins/maven-repo
    type: DirectoryOrCreate

---
# PersistentVolumeClaim - Jenkins logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-logs-pvc
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: jenkins
      type: logs

---
# PersistentVolumeClaim - Jenkins data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data-pvc
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 20Gi
  selector:
    matchLabels:
      app: jenkins
      type: data

---
# PersistentVolumeClaim - Maven cache
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-maven-repo-pvc
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app: jenkins
      type: maven-repo

---
# Jenkins runtime configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-config
  namespace: devops
data:
  JENKINS_OPTS: |
    --httpPort=8080
    --webroot=/var/jenkins_home/war
    --prefix=/jenkins

  JENKINS_JAVA_OPTS: |
    -Djava.awt.headless=true
    -Djenkins.install.runSetupWizard=false
    -Dhudson.model.DirectoryBrowserSupport.CSP=""
    -Xmx2g
    -Xms512m
    -XX:MaxMetaspaceSize=512m
    -XX:MetaspaceSize=256m
    -Duser.timezone=Asia/Shanghai

---
# Jenkins init script for creating the first admin user
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init-groovy
  namespace: devops
data:
  01-create-admin-user.groovy: |
    import hudson.security.HudsonPrivateSecurityRealm
    import jenkins.model.Jenkins

    def instance = Jenkins.get()
    def user = System.getenv("JENKINS_ADMIN_USER") ?: "admin"
    def password = System.getenv("JENKINS_ADMIN_PASSWORD")

    if (!password) {
      throw new IllegalStateException("JENKINS_ADMIN_PASSWORD is required")
    }

    def securityRealm = instance.getSecurityRealm()
    if (!(securityRealm instanceof HudsonPrivateSecurityRealm)) {
      securityRealm = new HudsonPrivateSecurityRealm(false)
      instance.setSecurityRealm(securityRealm)
    }

    if (securityRealm.getUser(user) == null) {
      securityRealm.createAccount(user, password)
    }

    instance.save()

  02-configure-security.groovy: |
    import jenkins.model.Jenkins
    import hudson.security.FullControlOnceLoggedInAuthorizationStrategy

    def instance = Jenkins.get()

    // Require login: logged-in users have full control, anonymous users read-only
    def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
    strategy.setAllowAnonymousRead(false)
    instance.setAuthorizationStrategy(strategy)

    // Disable self-registration
    instance.getSecurityRealm().setAllowsSignup(false)

    instance.save()

---
# Admin credential. Change this password before using outside a local tutorial.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-secret
  namespace: devops
type: Opaque
stringData:
  JENKINS_ADMIN_USER: admin
  JENKINS_ADMIN_PASSWORD: jenkins123456

---
# Optional Docker config for Kaniko registry push.
# Replace the value with your real docker config JSON before using Kaniko to push images.
apiVersion: v1
kind: Secret
metadata:
  name: kaniko-docker-config
  namespace: devops
type: Opaque
stringData:
  config.json: |
    {
      "auths": {}
    }

---
# Jenkins Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: devops
  labels:
    app: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      securityContext:
        fsGroup: 1000
      serviceAccountName: jenkins
      hostname: jenkins
      initContainers:
        - name: fix-jenkins-volume-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 1000:1000 /var/jenkins_home /var/log/jenkins
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: jenkins-logs
              mountPath: /var/log/jenkins
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              name: jnlp
          env:
            - name: JENKINS_OPTS
              valueFrom:
                configMapKeyRef:
                  name: jenkins-config
                  key: JENKINS_OPTS
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: jenkins-config
                  key: JENKINS_JAVA_OPTS
            - name: JENKINS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: JENKINS_ADMIN_USER
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-secret
                  key: JENKINS_ADMIN_PASSWORD
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: jenkins-logs
              mountPath: /var/log/jenkins
            - name: jenkins-init-groovy
              mountPath: /var/jenkins_home/init.groovy.d
              readOnly: true
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /jenkins/health
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /jenkins/login
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

        - name: maven
          image: maven:3.9.9-eclipse-temurin-21
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: maven-repo
              mountPath: /root/.m2/repository

        - name: kubectl
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          workingDir: /home/jenkins/agent
          env:
            - name: KUBECONFIG
              value: /home/jenkins/.kube/config
          volumeMounts:
            - name: kubeconfig
              mountPath: /home/jenkins/.kube
          command: ["cat"]
          stdin: true
          tty: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          env:
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: kaniko-docker-config
              mountPath: /kaniko/.docker
              readOnly: true

      volumes:
        - name: kubeconfig
          secret:
            secretName: kubeconfig-secret
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-data-pvc
        - name: jenkins-logs
          persistentVolumeClaim:
            claimName: jenkins-logs-pvc
        - name: maven-repo
          persistentVolumeClaim:
            claimName: jenkins-maven-repo-pvc
        - name: jenkins-init-groovy
          configMap:
            name: jenkins-init-groovy
        - name: kaniko-docker-config
          secret:
            secretName: kaniko-docker-config

---
# Service - NodePort
apiVersion: v1
kind: Service
metadata:
  name: jenkins-service-nodeport
  namespace: devops
  labels:
    app: jenkins
spec:
  selector:
    app: jenkins
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30090
      protocol: TCP
    - name: jnlp
      port: 50000
      targetPort: 50000
      nodePort: 30091
      protocol: TCP

---
# Jenkins Kubernetes Plugin uses this account to create build pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: devops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - services
      - secrets
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - watch
      - patch
      - update

  - apiGroups: [""]
    resources:
      - events
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: devops
