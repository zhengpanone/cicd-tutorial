# =============================================================================
# Neo4j on Kubernetes (Docker Desktop)
# Graph database with Browser HTTP and Bolt protocol access
# =============================================================================

# 1. PersistentVolume - neo4j-data-pv
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neo4j-data-pv
  labels:
    app: neo4j
    type: data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/neo4j/data
    type: DirectoryOrCreate

---
# 2. PersistentVolume - neo4j-import-pv
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neo4j-import-pv
  labels:
    app: neo4j
    type: import
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/neo4j/import
    type: DirectoryOrCreate

---
# 3. PersistentVolume - neo4j-plugins-pv
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neo4j-plugins-pv
  labels:
    app: neo4j
    type: plugins
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/neo4j/plugins
    type: DirectoryOrCreate

---
# 4. PersistentVolumeClaim - neo4j-data-pvc
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data-pvc
  namespace: default
  labels:
    app: neo4j
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  selector:
    matchLabels:
      app: neo4j
      type: data
  resources:
    requests:
      storage: 10Gi

---
# 5. PersistentVolumeClaim - neo4j-import-pvc
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-import-pvc
  namespace: default
  labels:
    app: neo4j
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  selector:
    matchLabels:
      app: neo4j
      type: import
  resources:
    requests:
      storage: 2Gi

---
# 6. PersistentVolumeClaim - neo4j-plugins-pvc
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-plugins-pvc
  namespace: default
  labels:
    app: neo4j
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  selector:
    matchLabels:
      app: neo4j
      type: plugins
  resources:
    requests:
      storage: 2Gi

---
# 7. Secret - neo4j-secret
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-secret
  namespace: default
  labels:
    app: neo4j
type: Opaque
stringData:
  NEO4J_AUTH: neo4j/neo4j1234

---
# 8. ConfigMap - neo4j-config
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-config
  namespace: default
  labels:
    app: neo4j
    type: config
data:
  server.default_listen_address: "0.0.0.0"
  server.http.listen_address: "0.0.0.0:7474"
  server.bolt.listen_address: "0.0.0.0:7687"
  server.memory.heap.initial_size: "512m"
  server.memory.heap.max_size: "1G"
  server.memory.pagecache.size: "512m"
  dbms.security.procedures.unrestricted: "apoc.*"
  dbms.security.procedures.allowlist: "apoc.*"

---
# 9. Headless Service - neo4j-headless
apiVersion: v1
kind: Service
metadata:
  name: neo4j-headless
  namespace: default
  labels:
    app: neo4j
spec:
  clusterIP: None
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: http
      protocol: TCP
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP

---
# 10. StatefulSet - neo4j
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: default
  labels:
    app: neo4j
spec:
  serviceName: neo4j-headless
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              chown -R 7474:7474 /data /import /plugins /logs
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-import
              mountPath: /import
            - name: neo4j-plugins
              mountPath: /plugins
            - name: neo4j-logs
              mountPath: /logs
      containers:
        - name: neo4j
          image: neo4j:2025.02.0-ubi9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7474
              protocol: TCP
            - name: bolt
              containerPort: 7687
              protocol: TCP
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-secret
                  key: NEO4J_AUTH
            - name: NEO4J_server_default__listen__address
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: server.default_listen_address
            - name: NEO4J_server_http_listen__address
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: server.http.listen_address
            - name: NEO4J_server_bolt_listen__address
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: server.bolt.listen_address
            - name: NEO4J_server_memory_heap_initial__size
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: server.memory.heap.initial_size
            - name: NEO4J_server_memory_heap_max__size
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: server.memory.heap.max_size
            - name: NEO4J_server_memory_pagecache_size
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: server.memory.pagecache.size
            - name: NEO4J_dbms_security_procedures_unrestricted
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: dbms.security.procedures.unrestricted
            - name: NEO4J_dbms_security_procedures_allowlist
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: dbms.security.procedures.allowlist
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-import
              mountPath: /import
            - name: neo4j-plugins
              mountPath: /plugins
            - name: neo4j-logs
              mountPath: /logs
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-data-pvc
        - name: neo4j-import
          persistentVolumeClaim:
            claimName: neo4j-import-pvc
        - name: neo4j-plugins
          persistentVolumeClaim:
            claimName: neo4j-plugins-pvc
        - name: neo4j-logs
          emptyDir: {}

---
# 11. Service - neo4j
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: default
  labels:
    app: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: http
      protocol: TCP
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP

---
# 12. Service - neo4j-nodeport
apiVersion: v1
kind: Service
metadata:
  name: neo4j-nodeport
  namespace: default
  labels:
    app: neo4j
spec:
  type: NodePort
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: http
      protocol: TCP
      nodePort: 30747
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP
      nodePort: 30687
