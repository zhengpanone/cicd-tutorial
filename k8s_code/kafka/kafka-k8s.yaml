apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-kraft-config
  namespace: default
data:
  cluster.id: "mY7BuJZ8QdWqvK1l5LkH3w"
  kafka.properties: |
    node.roles=broker,controller
    process.roles=broker,controller
    controller.quorum.voters=0@kafka-0.kafka-headless.default.svc.cluster.local:9093,1@kafka-1.kafka-headless.default.svc.cluster.local:9093,2@kafka-2.kafka-headless.default.svc.cluster.local:9093
    listeners=CONTROLLER://:9093,PLAINTEXT://:9092,EXTERNAL://:9094
    advertised.listeners=PLAINTEXT://__POD_NAME__.kafka-headless.default.svc.cluster.local:9092,EXTERNAL://__NODE_IP__:30094
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    controller.listener.names=CONTROLLER
    node.id=${BROKER_ID}
    controller.id=${BROKER_ID}
    metadata.log.dir=/var/lib/kafka/data/meta
    metadata.log.segment.bytes=134217728
    metadata.log.retention.bytes=10737418240
    log.dirs=/var/lib/kafka/data/logs
    num.partitions=3
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    log.retention.hours=168
    log.retention.bytes=1073741824
    log.cleanup.policy=delete
    auto.create.topics.enable=false
    delete.topic.enable=true
    compression.type=producer
    message.max.bytes=10485760
    replica.fetch.max.bytes=10485760
    ssl.client.auth=none
    sasl.enabled.mechanisms=
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app: kafka
spec:
  ports:
  - port: 9092
    name: client
  - port: 9093
    name: controller
  - port: 9094
    name: external
  clusterIP: None
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  labels:
    app: kafka
spec:
  ports:
  - port: 9092
    targetPort: 9092
    name: client
  selector:
    app: kafka
  type: ClusterIP
---
# ✅ 新增：对外暴露的 NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  labels:
    app: kafka
spec:
  type: NodePort
  ports:
  - port: 9094
    targetPort: 9094
    nodePort: 30094      # 其他电脑连接这个端口
    name: external
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: init-kafka
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          BROKER_INDEX=${HOSTNAME##*-}
          mkdir -p /run/desktop/mnt/host/e/dockerstore/kafka/broker-${BROKER_INDEX}/logs
          mkdir -p /run/desktop/mnt/host/e/dockerstore/kafka/broker-${BROKER_INDEX}/meta
          chown -R 1000:1000 /run/desktop/mnt/host/e/dockerstore/kafka
          echo "Created dirs for broker-${BROKER_INDEX}"
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: kafka-data
          mountPath: /run/desktop/mnt/host/e/dockerstore/kafka
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        env:
        - name: CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: kafka-kraft-config
              key: cluster.id
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        # ✅ 不再需要 EXTERNAL_IP，改为固定宿主机IP
        command:
        - sh
        - -c
        - |
          BROKER_INDEX=${HOSTNAME##*-}
          cp /etc/kafka/kraft.properties /tmp/kraft.properties
          sed -i "s|\${BROKER_ID}|${BROKER_INDEX}|g" /tmp/kraft.properties
          sed -i "s|/var/lib/kafka/data|/run/desktop/mnt/host/e/dockerstore/kafka/broker-${BROKER_INDEX}|g" /tmp/kraft.properties
          sed -i "s|__POD_NAME__|${HOSTNAME}|g" /tmp/kraft.properties
          sed -i "s|__NODE_IP__|${NODE_IP}|g" /tmp/kraft.properties

          if [ ! -f /run/desktop/mnt/host/e/dockerstore/kafka/broker-${BROKER_INDEX}/meta/meta.properties ]; then
            echo "Initializing KRaft metadata for broker-${BROKER_INDEX}..."
            kafka-storage format --ignore-formatted -t $CLUSTER_ID -c /tmp/kraft.properties
          fi
          exec kafka-server-start /tmp/kraft.properties
        ports:
        - containerPort: 9092
          name: client
        - containerPort: 9093
          name: controller
        - containerPort: 9094
          name: external
        volumeMounts:
        - name: config
          mountPath: /etc/kafka/kraft.properties
          subPath: kraft.properties
        - name: kafka-data
          mountPath: /run/desktop/mnt/host/e/dockerstore/kafka
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 20
      volumes:
      - name: config
        configMap:
          name: kafka-kraft-config
          items:
          - key: kafka.properties
            path: kraft.properties
      - name: kafka-data
        hostPath:
          path: /run/desktop/mnt/host/e/dockerstore/kafka
          type: DirectoryOrCreate

---
# =============================================================================
# Kafka UI Dashboard（provectuslabs/kafka-ui）
# 域名: kafka-ui.k8s
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: default
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka-bootstrap:9092
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: default
  labels:
    app: kafka-ui
spec:
  selector:
    app: kafka-ui
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kafka-ui.k8s
      secretName: default-tls
  rules:
    - host: kafka-ui.k8s
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080