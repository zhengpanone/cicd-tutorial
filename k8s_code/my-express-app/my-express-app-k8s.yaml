---
apiVersion: v1
kind: Namespace
metadata:
  name: web-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-express-app
  namespace: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-express-app
  template:
    metadata:
      labels:
        app: my-express-app
    spec:
      containers:
        - name: my-express-app
          image: host.docker.internal:5001/my-express-app:v1.0.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: my-express-app
  namespace: web-app
spec:
  selector:
    app: my-express-app
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30002
      protocol: TCP

---
# Gateway API HTTPRoute: my-express-app
# Shared listener ports: HTTP 18080, HTTPS 18443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-express-app
  namespace: web-app
spec:
  parentRefs:
  - name: main-gateway
    namespace: istio-system
    sectionName: https
  hostnames:
  - my-express-app.k8s
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: my-express-app
      port: 3000
