apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80

---
# Gateway API HTTPRoute: test-demo
# Shared listener ports: HTTP 18080, HTTPS 18443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-demo
  namespace: default
spec:
  parentRefs:
  - name: main-gateway
    namespace: istio-system
    sectionName: http
  hostnames:
  - test.k8s
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nginx-service
      port: 80
