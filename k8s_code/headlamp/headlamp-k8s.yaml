# =============================================================================
# Headlamp on Kubernetes (Docker Desktop)
# K8s 官方推荐的 Dashboard 替代品，支持 ServiceAccount Token 登录
# 参考官方文档: https://headlamp.dev/docs/latest/installation/
# =============================================================================

# 1. Namespace - headlamp
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp

---
# 2. ServiceAccount - headlamp-admin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp

---
# 3. ClusterRoleBinding - headlamp-admin -> cluster-admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp

---
# 4. Deployment - headlamp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp-admin
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 100
        runAsGroup: 101
        runAsNonRoot: true
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -plugins-dir=/headlamp/plugins
            - -me-username-path=sub
            - -log-level=debug
          ports:
            - containerPort: 4466
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
# 5. Service - headlamp（ClusterIP）
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4466
      protocol: TCP
      name: http
  selector:
    app: headlamp

---
# 6. Service - headlamp-nodeport（NodePort 外部访问）
apiVersion: v1
kind: Service
metadata:
  name: headlamp-nodeport
  namespace: headlamp
  labels:
    app: headlamp
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 4466
      nodePort: 30443
      protocol: TCP
      name: http
  selector:
    app: headlamp

---
# 7. Ingress - headlamp（通过 ingress-nginx 访问）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - headlamp.k8s
      secretName: headlamp-tls
  rules:
    - host: headlamp.k8s
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
