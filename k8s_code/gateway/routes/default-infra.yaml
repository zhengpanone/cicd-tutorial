# =============================================================================
# default 命名空间 13 条 HTTPRoute(原 12 个 + kafka-ui)
# 全部走 https listener,共用 default-tls(多 SAN 证书)。
#
# 特殊处理:
#  - nacos:原 nginx.ingress.kubernetes.io/app-root: /nacos
#    翻译为 RequestRedirect filter,仅对根路径 "/" 做 308 重定向到 /nacos/
#    (不要用 URLRewrite,那样会把 /foo 也改写成 /nacos/foo,语义不对)。
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nacos
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "nacos.k8s"
  rules:
    # 规则 1:根路径 308 重定向到 /nacos/(对应 nginx 的 app-root annotation)
    - matches:
        - path:
            type: PathPrefix
            value: /
          # 注意:PathPrefix / 会同时匹配根和所有子路径,所以用 RequestRedirect
          # 配合 path.ReplacePrefixMatch / → /nacos/ 会导致 /xxx 也被改写。
          # Gateway API 暂无"仅根路径"匹配,所以这里把"/"和"/nacos..."分两条规则:
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /nacos/
            statusCode: 308
      backendRefs:
        # 兜底后端(RequestRedirect 不会真正转发,这里是 spec 必填项)
        - name: nacos-service-nodeport
          port: 8848
    # 规则 2:/nacos 及其子路径正常转发
    - matches:
        - path:
            type: PathPrefix
            value: /nacos
      backendRefs:
        - name: nacos-service-nodeport
          port: 8848

