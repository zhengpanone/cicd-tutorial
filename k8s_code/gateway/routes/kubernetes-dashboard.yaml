# =============================================================================
# kubernetes-dashboard 命名空间:历史 headlamp Ingress
# (原 infra-ingress.yaml L480-504)
#
# ⚠️ 历史包袱:此 Ingress 写的 namespace 是 kubernetes-dashboard,但实际
# Deployment/Service 部署在 headlamp 命名空间(headlamp-k8s.yaml)。迁移后
# 完整保留为两条 HTTPRoute,共用一个 Secret 名 headlamp-tls(各 ns 一份),
# 是否合并两条 HTTPRoute 由用户自行决定。
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: kubernetes-dashboard
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "headlamp.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
