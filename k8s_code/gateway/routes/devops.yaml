# =============================================================================
# devops routes through main-gateway.
# jenkins: HTTP and HTTPS.
# gitea: HTTP and HTTPS.
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jenkins
  namespace: devops
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: http
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "jenkins.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jenkins-service-nodeport
          port: 8080

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: devops
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: http
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "gitea.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitea
          port: 3000
