# =============================================================================
# web-app 命名空间 3 条 HTTPRoute
# 原 web-app-ingress.yaml + ingress-nginx/web-app-ingress/web-app-ingress.yaml
# 同一份路由声明存在两份冗余,迁移后合并为 1 份。
# 所有 host 用 k8s 占位,README 强提示替换为真实域名。
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-gin-app
  namespace: web-app
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "my-gin-app.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-gin-app
          port: 8080

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-express-app
  namespace: web-app
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "my-express-app.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-express-app
          port: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-springboot-app
  namespace: web-app
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - "my-springboot-app.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-springboot-app
          port: 8080
