# =============================================================================
# 无 TLS 入口的 4 条 HTTPRoute(http listener)
#
# 1. nginx-demo    (nginx/nginx-k8s.yaml 内嵌)         host: nginx.local
# 2. rabbitmq-demo (rabbitmq/rabbitmq-k8s.yaml 内嵌)   host: rabbitmq.local
#                  原 ingressClassName: public(MicroK8s 标记)
#                  原 nginx.ingress.kubernetes.io/rewrite-target: /
#                  → URLRewrite.ReplacePrefixMatch / → /(noop,保留语义)
# 3. nexus-demo    (nexus/nexus-k8s.yaml 内嵌)         host: nexus.example.com
#                  原 proxy-body-size: "0" → 见 gateway/patches/
# 4. test-demo     (k8s_demo/ingress.yaml)             host: test.local
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-demo
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - "nginx.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-service
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq-demo
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - "rabbitmq.k8s"
  rules:
    # 原 rewrite-target: / 等价于把任意 path 都改写到 / 再转发,实际就是
    # 强制走根路径。用 ReplacePrefixMatch / → / 显式表达(noop,但语义清晰)。
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: rabbitmq-service
          port: 15672

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus-demo
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - "nexus.k8s"
  rules:
    # NOTE: 原 proxy-body-size=0。Istio gateway 默认不硬性限制请求体,
    # Nexus 上传大制品建议 apply gateway/patches/envoy-max-request-bytes.yaml。
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nexus-service
          port: 8081

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-demo
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - "test.k8s"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-service
          port: 80
