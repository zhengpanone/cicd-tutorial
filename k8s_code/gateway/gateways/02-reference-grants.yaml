# =============================================================================
# ReferenceGrant:允许 istio-system 里的 Gateway 跨 ns 引用本 ns 里的 TLS Secret
# 必须放在 Secret 所在 ns。
#   from = 发起引用方(istio-system 的 Gateway),只能用 namespace,不能有 name
#   to   = 被引用方(本 ns 的 Secret),用 name 精确到具体 Secret
# 6 个 ns 一条,共 6 个 ReferenceGrant。
# =============================================================================

---
# 1) web-app ns: web-app-tls
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-main-gateway
  namespace: web-app
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: istio-system
  to:
    - group: ""
      kind: Secret
      name: web-app-tls

---
