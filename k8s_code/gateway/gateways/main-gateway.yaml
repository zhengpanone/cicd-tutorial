# =============================================================================
# Main Gateway: shared Gateway API entrypoint for local k8s hosts.
# Namespace: istio-system
# GatewayClass: istio
# =============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: istio-system
  labels:
    app.kubernetes.io/name: main-gateway
    app.kubernetes.io/managed-by: kubectl
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 18080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      port: 18443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: devops-tls
            namespace: devops
      allowedRoutes:
        namespaces:
          from: All
