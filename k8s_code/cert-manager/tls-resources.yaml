# =============================================================================
# cert-manager TLS 资源清单
# 自签名 CA -> ClusterIssuer -> 各命名空间独立证书
# =============================================================================

# 1. 自签名 ClusterIssuer（集群级，用于签发 CA 证书）
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}

---
# 2. CA 证书（中间 CA，有效期 10 年）
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-ca
  secretName: k8s-ca-secret
  duration: 87600h # 10 年
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
# 3. CA ClusterIssuer（用中间 CA 签发各命名空间的应用证书）
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k8s-ca-issuer
spec:
  ca:
    secretName: k8s-ca-secret

---
# 4. web-app 命名空间证书（gin, express, springboot）
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-app-tls
  namespace: web-app
spec:
  secretName: web-app-tls
  duration: 8760h # 1 年
  renewBefore: 720h # 到期前 30 天自动续签
  commonName: gin.k8s
  dnsNames:
    - gin.k8s
    - express.k8s
    - springboot.k8s
  issuerRef:
    name: k8s-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
# 5. devops 命名空间证书（jenkins）
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devops-tls
  namespace: devops
spec:
  secretName: devops-tls
  duration: 8760h
  renewBefore: 720h
  commonName: jenkins.k8s
  dnsNames:
    - jenkins.k8s
  issuerRef:
    name: k8s-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
# 6. default 命名空间证书（nacos, consul, rustfs, prometheus, jaeger, sentinel, minio, rocketmq, redisinsight, attu）
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: default-tls
  namespace: default
spec:
  secretName: default-tls
  duration: 8760h
  renewBefore: 720h
  commonName: nacos.k8s
  dnsNames:
    - nacos.k8s
    - consul.k8s
    - rustfs.k8s
    - prometheus.k8s
    - jaeger.k8s
    - sentinel.k8s
    - minio.k8s
    - rocketmq.k8s
    - redisinsight.k8s
    - attu.k8s
  issuerRef:
    name: k8s-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
# 7. dinginx-efk 命名空间证书（kibana）
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: efk-tls
  namespace: dinginx-efk
spec:
  secretName: efk-tls
  duration: 8760h
  renewBefore: 720h
  commonName: kibana.k8s
  dnsNames:
    - kibana.k8s
  issuerRef:
    name: k8s-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
