---
# 1. 创建 PersistentVolume (PV) - 存储静态文件
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-html-pv
  labels:
    app: nginx
    type: html
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /opt/dockerstore/nginx/html
    type: DirectoryOrCreate

---
# 2. 创建 PersistentVolume (PV) - 存储日志
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-logs-pv
  labels:
    app: nginx
    type: logs
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /opt/dockerstore/nginx/logs
    type: DirectoryOrCreate
---
# 3. 创建 PersistentVolume (PV) - 存储配置文件
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-conf-pv
  labels:
    app: nginx
    type: conf
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    # 宿主机存放配置文件的目录 (确保此目录已执行过"第一步"的拷贝操作)
    path: /opt/dockerstore/nginx/conf.d
    type: DirectoryOrCreate

---
# 3. 创建 PersistentVolumeClaim (PVC) - HTML
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-html-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: nginx
      type: html

---
# 4. 创建 PersistentVolumeClaim (PVC) - Logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-logs-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
  selector:
    matchLabels:
      app: nginx
      type: logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-conf-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      app: nginx
      type: conf
