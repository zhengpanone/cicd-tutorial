# =============================================================================
# Gitea on Kubernetes (Docker Desktop)
# Lightweight self-hosted Git service with HTTP and SSH access.
# Reference: https://docs.gitea.com/installation/install-with-docker
# =============================================================================

# 1. Namespace - devops
apiVersion: v1
kind: Namespace
metadata:
  name: devops

---
# 2. PersistentVolume - Gitea data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitea-data-pv
  labels:
    app: gitea
    type: data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/host/e/dockerstore/gitea/data
    type: DirectoryOrCreate

---
# 3. PersistentVolumeClaim - Gitea data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data-pvc
  namespace: devops
  labels:
    app: gitea
    type: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app: gitea
      type: data

---
# 4. Deployment - Gitea
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: devops
  labels:
    app: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              mkdir -p /data
              chown -R 1000:1000 /data
              chmod -R 755 /data
          volumeMounts:
            - name: gitea-data
              mountPath: /data
      containers:
        - name: gitea
          image: gitea/gitea:1.26.4
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 22
              name: ssh
              protocol: TCP
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: TZ
              value: Asia/Shanghai
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /data/gitea/gitea.db
            - name: GITEA__server__DOMAIN
              value: localhost
            - name: GITEA__server__SSH_DOMAIN
              value: localhost
            - name: GITEA__server__SSH_PORT
              value: "30022"
            - name: GITEA__server__ROOT_URL
              value: http://localhost:30030/
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: gitea-data-pvc

---
# 5. Service - ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: devops
  labels:
    app: gitea
spec:
  type: ClusterIP
  selector:
    app: gitea
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 22
      targetPort: 22
      protocol: TCP
      name: ssh

---
# 6. Service - NodePort
apiVersion: v1
kind: Service
metadata:
  name: gitea-nodeport
  namespace: devops
  labels:
    app: gitea
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
      protocol: TCP
      name: http
    - port: 22
      targetPort: 22
      nodePort: 30022
      protocol: TCP
      name: ssh

---
# 7. Ingress - HTTP access through ingress-nginx
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: devops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: gitea.k8s
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 3000
