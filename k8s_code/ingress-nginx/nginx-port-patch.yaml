# =============================================================================
# ingress-nginx 端口配置：Service 使用 18080/18443（宿主机 80 端口被占用）
# 解决 Docker Desktop 不转发 hostPort 18443 的问题
#
# 使用方式（两步）：
#   kubectl apply -f nginx-port-patch.yaml
#   kubectl patch deployment ingress-nginx-controller -n ingress-nginx --type=json \
#     -p='[{"op":"replace","path":"/spec/template/spec/containers/0/ports","value":[{"containerPort":80,"name":"http","protocol":"TCP"},{"containerPort":443,"name":"https","protocol":"TCP"},{"containerPort":8443,"name":"webhook","protocol":"TCP"}]}]'
# =============================================================================

# 更新 Service 端口为 18080 (HTTP) / 18443 (HTTPS)
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  ports:
    - appProtocol: http
      name: http
      port: 18080
      targetPort: http
      protocol: TCP
    - appProtocol: https
      name: https
      port: 18443
      targetPort: https
      protocol: TCP
