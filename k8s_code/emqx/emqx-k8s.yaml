---
apiVersion: v1
kind: Namespace
metadata:
  name: emqx
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: emqx-data-pv
  labels:
    app: emqx
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/emqx/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emqx-data-pvc
  namespace: emqx
  labels:
    app: emqx
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  selector:
    matchLabels:
      app: emqx
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: emqx-secret
  namespace: emqx
type: Opaque
stringData:
  EMQX_DASHBOARD__DEFAULT_USERNAME: admin
  EMQX_DASHBOARD__DEFAULT_PASSWORD: public
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: emqx
  labels:
    app: emqx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/emqx/data /opt/emqx/log
              chown -R 1000:1000 /opt/emqx/data /opt/emqx/log
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data-volume
              mountPath: /opt/emqx/data
            - name: log-volume
              mountPath: /opt/emqx/log
      containers:
        - name: emqx
          image: emqx/emqx:5.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
            - name: mqtts
              containerPort: 8883
              protocol: TCP
            - name: ws
              containerPort: 8083
              protocol: TCP
            - name: wss
              containerPort: 8084
              protocol: TCP
            - name: dashboard
              containerPort: 18083
              protocol: TCP
          envFrom:
            - secretRef:
                name: emqx-secret
          volumeMounts:
            - name: data-volume
              mountPath: /opt/emqx/data
            - name: log-volume
              mountPath: /opt/emqx/log
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: emqx-data-pvc
        - name: log-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: emqx
  labels:
    app: emqx
spec:
  type: NodePort
  selector:
    app: emqx
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
      nodePort: 31883
    - name: ws
      port: 8083
      targetPort: ws
      protocol: TCP
      nodePort: 30083
    - name: dashboard
      port: 18083
      targetPort: dashboard
      protocol: TCP
      nodePort: 30084
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-headless
  namespace: emqx
  labels:
    app: emqx
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: emqx
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: dashboard
      port: 18083
      targetPort: dashboard
