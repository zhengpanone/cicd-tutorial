# 1-pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: emqx-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/emqx/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: emqx-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /run/desktop/mnt/host/e/dockerstore/emqx/config
    type: DirectoryOrCreate
--- 
# 2-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emqx-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emqx-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
---                 
# 3-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: emqx-config

data:
  emqx.conf: |
    # EMQX 基本配置
    node.name = emqx@${EMQX_NODE_NAME}
    node.cookie = ${EMQX_NODE__COOKIE:-emqxsecretcookie}
    cluster.discovery = k8s
    cluster.k8s.apiserver = https://kubernetes.default.svc:443
    cluster.k8s.service_name = emqx-headless
    cluster.k8s.namespace = emqx
    cluster.k8s.address_type = hostname
    cluster.k8s.suffix = .emqx-headless.emqx.svc.cluster.local
    
    # 监听器配置
    listener.tcp.external = 0.0.0.0:1883
    listener.tcp.external.acceptors = 16
    listener.tcp.external.max_connections = 1024000
    
    # Dashboard 配置
    dashboard.listeners.http.bind = 0.0.0.0:18083
    
    # 日志级别
    log.level = warning
    
    # 保留消息
    retainer.storage_type = disc
    retainer.max_retained_messages = 1000
    
    # 认证（禁用，可选配置）
    # authentication = []
    
    # 持久化
    persistence = on
---
# 4-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx

  labels:
    app: emqx
    component: mqtt-broker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: emqx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: emqx
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: emqx
        image: emqx/emqx:5.3.0
        imagePullPolicy: IfNotPresent
        env:
        - name: EMQX_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: EMQX_NODE__COOKIE
          valueFrom:
            secretKeyRef:
              name: emqx-secret
              key: cookie
              optional: true
        - name: EMQX_API_KEY
          valueFrom:
            secretKeyRef:
              name: emqx-secret
              key: api-key
              optional: true
        ports:
        - name: mqtt
          containerPort: 1883
          protocol: TCP
        - name: mqtts
          containerPort: 8883
          protocol: TCP
        - name: ws
          containerPort: 8083
          protocol: TCP
        - name: wss
          containerPort: 8084
          protocol: TCP
        - name: dashboard
          containerPort: 18083
          protocol: TCP
        - name: management
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /status
            port: 8081    # 修改为 management 端口
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config-volume
          mountPath: /opt/emqx/etc/emqx.conf
          subPath: emqx.conf
        - name: data-volume
          mountPath: /opt/emqx/data
        - name: log-volume
          mountPath: /opt/emqx/log
      volumes:
      - name: config-volume
        configMap:
          name: emqx-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: emqx-data-pvc
      - name: log-volume
        emptyDir: {}
---
# 5-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: emqx

  labels:
    app: emqx
spec:
  type: NodePort
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
    protocol: TCP
    nodePort: 31883
  - name: ws
    port: 8083
    targetPort: 8083
    protocol: TCP
    nodePort: 38083
  - name: dashboard
    port: 18083
    targetPort: 18083
    protocol: TCP
    nodePort: 38084
  selector:
    app: emqx
---
# Headless Service (用于集群发现)
apiVersion: v1
kind: Service
metadata:
  name: emqx-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: epmd
    port: 4369
  - name: emqx-dist
    port: 4370
  selector:
    app: emqx


