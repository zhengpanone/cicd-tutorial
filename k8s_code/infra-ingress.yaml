# =============================================================================
# 基础设施服务 Ingress 统一配置
# 域名规则: <服务名>.k8s
# TLS 证书由 cert-manager 自动管理，各命名空间独立 Secret
# =============================================================================

# ─── devops 命名空间 ───────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: devops
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jenkins.k8s
      secretName: devops-tls
  rules:
    - host: jenkins.k8s
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins-service-nodeport
                port:
                  number: 8080

