# =============================================================================
# web-app 统一 Ingress 配置
# 所有应用共享 web-app-tls 证书（由 cert-manager 自动管理）
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-gin-app
  namespace: web-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gin.k8s
      secretName: web-app-tls
  rules:
    - host: gin.k8s
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-gin-app
                port:
                  number: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-express-app
  namespace: web-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - express.k8s
      secretName: web-app-tls
  rules:
    - host: express.k8s
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-express-app
                port:
                  number: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-springboot-app
  namespace: web-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - springboot.k8s
      secretName: web-app-tls
  rules:
    - host: springboot.k8s
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-springboot-app
                port:
                  number: 8080
