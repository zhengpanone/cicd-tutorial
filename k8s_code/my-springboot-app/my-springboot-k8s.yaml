---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: web-app
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-springboot-app
  namespace: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-springboot-app
  template:
    metadata:
      labels:
        app: my-springboot-app
    spec:
      containers:
        - name: my-springboot-app
          image: host.docker.internal:5001/my-springboot-app:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: my-springboot-app
  namespace: web-app
spec:
  type: NodePort
  selector:
    app: my-springboot-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30004
      protocol: TCP
