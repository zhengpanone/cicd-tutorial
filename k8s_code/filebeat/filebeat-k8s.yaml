apiVersion: v1
kind: ConfigMap
metadata:
   name: filebeat-config
   namespace: dinginx-efk
   labels:
      k8s-app: filebeat
data:
   filebeat.yml: |-
      filebeat.config:
         inputs:
            path:  ${path.config}/inputs.d/*.yml
            reload.enabled:  false
         modules:
            path:  ${path.config}/modules.d/*.yml
            reload.enabled:  false
      output.elasticsearch:
          # hosts: ['elasticsearch.dinginx-efk:9200']
          # hosts: ['elasticsearch.dinginx-efk.svc.oldboyedu.com:9200']
         hosts: ['elasticsearch:9200']
          # 不建议修改索引，因为索引名称修改后，pod的数据也将收集不到啦!
          # 除非你明确知道自己不收集Pod日志且需要自定义索引名称的情况下，可以打开下面的注释哟~
          # index: 'dinginx-linux-elk-%{+yyyy.MM.dd}'
       # 配置索引模板
       # setup.ilm.enabled: false
       # setup.template.name: "dinginx-linux-elk"
       # setup.template.pattern: "dinginx-linux-elk*"
       # setup.template.overwrite: true
       # setup.template.settings:
       #    index.number_of_shards: 3
       #    index.number_of_replicas: 0
---
# 注意，官方在filebeat 7.2就已经废弃docker类型，建议后期更换为container.
apiVersion: v1
kind: ConfigMap
metadata:
   name: filebeat-inputs
   namespace: dinginx-efk
   labels:
      k8s-app: filebeat
data:
   kubernetes.yml: |-
      -  type: docker
         containers.ids:
         -  "*"
         processors:
            - add_kubernetes_metadata:
                  in_cluster:  true
---
apiVersion: apps/v1  
kind: DaemonSet
metadata:
   name: filebeat
   namespace: dinginx-efk
   labels:
      k8s-app: filebeat
spec:
  selector:
    matchLabels:
        k8s-app: filebeat
  template:
    metadata:
        labels:
          k8s-app: filebeat
    spec:
        tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
          operator: Exists
        serviceAccountName: filebeat
        terminationGracePeriodSeconds: 30
        containers:
        - name: filebeat
          image: harbor.dinginx.org/dinginx-elasticstack/filebeat:7.10.2
          args: [
              "-c",  "/etc/filebeat.yml",
              "-e",
          ]
          securityContext:
              runAsUser: 0
          resources:
              limits:
                memory: 200Mi
              requests:
                cpu: 100m
                memory: 100Mi
          volumeMounts:
          - name: config
              mountPath: /etc/filebeat.yml
              readOnly:  true
              subPath: filebeat.yml
          - name: inputs
              mountPath: /usr/share/filebeat/inputs.d
              readOnly:  true
          - name: data
              mountPath: /usr/share/filebeat/data
          - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly:  true
        volumes:
        - name: config
          configMap:
              defaultMode: 0600
              name: filebeat-config
        - name: varlibdockercontainers
          hostPath:
              path: /var/lib/docker/containers
        - name: inputs
          configMap:
              defaultMode: 0600
              name: filebeat-inputs
        - name: data
          hostPath:
              path: /var/lib/filebeat-data
              type: DirectoryOrCreate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: dinginx-efk
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    k8s-app: filebeat
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - pods
  verbs:
  - get
  - watch
  - list
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: dinginx-efk
  labels:
    k8s-app: filebeat