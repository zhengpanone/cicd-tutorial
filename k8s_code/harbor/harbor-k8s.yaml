# 26. Deployment - harbor-portal（Web UI 前端）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-portal
  namespace: harbor
  labels:
    app: harbor-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-portal
  template:
    metadata:
      labels:
        app: harbor-portal
    spec:
      containers:
        - name: harbor-portal
          image: goharbor/harbor-portal:v2.15.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: portal-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: portal-tmp
              mountPath: /tmp
            - name: portal-cache
              mountPath: /var/cache/nginx
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: portal-nginx-config
          configMap:
            name: harbor-portal-config
        - name: portal-tmp
          emptyDir: {}
        - name: portal-cache
          emptyDir: {}

---
# 27. Service - harbor-portal
apiVersion: v1
kind: Service
metadata:
  name: harbor-portal
  namespace: harbor
  labels:
    app: harbor-portal
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: harbor-portal

---
