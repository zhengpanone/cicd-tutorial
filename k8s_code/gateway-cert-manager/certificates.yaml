# =============================================================================
# Certificate resources for Gateway TLS.
#
# Notes:
# - cert-manager CRDs must be installed before applying this file.
# - The local .k8s names are suitable for a lab only. For ACME/Let's Encrypt,
#   replace them with real DNS names that you control.
# - Secret names match Gateway certificateRefs.
# =============================================================================

---
# 1) web-app namespace: my-gin / my-express / my-springboot
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-app-tls
  namespace: web-app
spec:
  secretName: web-app-tls
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "my-gin-app.k8s"
    - "my-express-app.k8s"
    - "my-springboot-app.k8s"

---
