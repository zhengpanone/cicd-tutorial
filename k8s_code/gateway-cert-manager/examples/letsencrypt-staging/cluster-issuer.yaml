# =============================================================================
# Optional Let's Encrypt staging ClusterIssuer for real, publicly reachable
# domains. It is not part of the local .k8s setup.
#
# ⚠️ 重要约束(必须看 README!):
#   现有域名 `*.k8s` / `*.local` / `*.example.com` / `nexus.example.com`
#   都不是真实可解析的 DNS 域名。LE staging 申请证书必须满足 HTTP-01
#   challenge,所以这些占位 host 必须由用户替换成自己拥有/解析的真实域名,
#   并且把 `*.<your-domain>` 通配 CNAME 到 istio-ingressgateway 的
#   LoadBalancer 公网 IP。否则 Certificate 会永久 Pending。
#
# cert-manager v1.14+ uses the Gateway API solver through gatewayHTTPRoute.
# =============================================================================

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # LE staging endpoint(签发的证书浏览器默认不信任,适合测试)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # TODO: 替换为你自己的真实邮箱(LE 会在证书快到期时发提醒)
    # 当前为本地教学占位(LE 会 reject,仅作 deploy 前必须修改的标记)
    email: admin@k8s.local
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      # HTTP-01 + Gateway API. The HTTP listener must be reachable on port 80
      # from the public Internet for Let's Encrypt validation to succeed.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: main-gateway
                namespace: istio-system
                group: gateway.networking.k8s.io
                kind: Gateway
                sectionName: http
