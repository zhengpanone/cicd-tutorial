# =============================================================================
# Optional per-namespace Certificate resources for a real-domain ACME setup.
# The default local Gateway setup uses 04-wildcard-k8s-certificate.yaml instead.
#
# Notes:
# - cert-manager CRDs and cluster-issuer.yaml must be installed first.
# - Replace every .k8s name with a real DNS name that you control before use.
# - These per-namespace secrets are optional and are not used by the local
#   wildcard Gateway certificate.
# =============================================================================

---
# 1) web-app namespace: my-gin / my-express / my-springboot
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-app-tls
  namespace: web-app
spec:
  secretName: web-app-tls
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "my-gin-app.k8s"
    - "my-express-app.k8s"
    - "my-springboot-app.k8s"

---
# 2) devops namespace: Jenkins and Gitea
