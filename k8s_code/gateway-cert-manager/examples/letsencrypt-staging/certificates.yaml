    - "nacos.k8s"
    - "consul.k8s"
    - "rustfs.k8s"
    - "prometheus.k8s"
    - "jaeger.k8s"
    - "sentinel.k8s"
    - "minio.k8s"
    - "rocketmq.k8s"
    - "redisinsight.k8s"
    - "emqx.k8s"
    - "attu.k8s"
    - "grafana.k8s"
    - "loki.k8s"
    - "kafka-ui.k8s"

